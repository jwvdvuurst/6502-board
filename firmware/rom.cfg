MEMORY {
 ZP: start=$0040, size=$0080, type=rw;
 RAM: start=$0300, size=$0100, type=rw;
 ROM: start=$E000, size=$1FFA, type=ro, file=%O, fill=yes, fillval=$FF;
 VEC: start=$FFFA, size=6, type=ro, file=%O;
}
SEGMENTS {
 ZEROPAGE: load=ZP, type=zp;
 BSS: load=RAM, type=bss;
 CODE: load=ROM, type=ro;
 VECTORS: load=VEC, type=ro;
}
